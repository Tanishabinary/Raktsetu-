
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RaktSetu - A Bridge Between Donors and Lives</title>
    <link rel="stylesheet" href="style.css">

 <style>
        /* RaktaSetu Logo */
        .brand-logo {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .brand-logo img {
            width: 180px;
            max-width: 80%;
            height: auto;
            object-fit: contain;
            display: block;
        }
    </style>
</head>

<body>

    <header class="brand">
        <div class="brand-logo">
            <img src="raktsetu-logo.jpeg" alt="RaktaSetu - The Bridge Between Donors and Lives">
        </div>
        <h3>A Bridge Between Donors and Lives</h3>
    </header>

    <main class="welcome-card">
        <div class="blood-icon">🩸</div>

        <h2>Welcome to RaktSetu!</h2>
        <p class="description">
            Connecting blood donors with those in need.
            Together, we can save lives.
        </p>

        <div class="account-option">
            <span>Already have an account?</span>
            <a href="login.html" class="btn btn-primary">
                Login
            </a>
        </div>

        <div class="account-option">
            <span>Don't have an account?</span>
            <a href="createaccount.html" class="btn btn-secondary">
                Create Account
            </a>
        </div>
    </main>

    <footer>
        <p>Every Drop Counts. Every Life Matters.</p>
        <p>&copy; 2026 RaktaSetu</p>
    </footer>

</body>
</html>
