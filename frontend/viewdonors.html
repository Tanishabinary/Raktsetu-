
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Donors | RaktSetu</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .donor-table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 20px;
        }

        .donor-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        .donor-table th,
        .donor-table td {
            padding: 12px;
            border: 1px solid #eadbd7;
            text-align: left;
        }

        .donor-table th {
            background: #6D1428;
            color: white;
        }

        .donor-table tr:nth-child(even) {
            background: #FFF4E3;
        }

        .search-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }

        .search-controls input,
        .search-controls select {
            flex: 1;
            min-width: 180px;
        }

        .view-btn {
            background: #6D1428;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .empty-message {
            text-align: center;
            padding: 20px;
        }
   
        /* RaktaSetu Logo */
        .brand-logo {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .brand-logo img {
            width: 180px;
            max-width: 80%;
            height: auto;
            object-fit: contain;
            display: block;
        }
    </style>
</head>

<body>

    <header class="brand">
        <div class="brand-logo">
            <img src="raktsetu-logo.jpeg"
                 alt="RaktSetu - The Bridge Between Donors and Lives">
        </div>
        <h3>A Bridge Between Donors and Lives</h3>
    </header>

    <main class="form-card">

        <h2>Registered Donors</h2>

        <p class="description">
            Search and view registered donor records.
        </p>

        <div class="search-controls">
            <input
                type="search"
                id="searchInput"
                placeholder="Search by name, blood group or city..."
                aria-label="Search donors"
            >

            <select id="bloodFilter" aria-label="Filter by blood group">
                <option value="">All Blood Groups</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
            </select>
        </div>

        <div class="donor-table-container">
            <table class="donor-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Blood Group</th>
                        <th>City</th>
                        <th>Contact</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="donorTableBody"></tbody>
            </table>
        </div>

        <p id="emptyMessage" class="empty-message">
            No donors are registered yet.
        </p>

        <p class="back-link">
            <a href="dashboard.html">← Back to Dashboard</a>
        </p>

    </main>

    <footer>
        <p>© 2026 RaktaSetu | A Bridge Between Donors and Lives</p>
    </footer>

    <script>
        /*
          Illustrative sample data for frontend testing.
          Replace this array with backend/database records
          when your backend is integrated.
        */
        const donors = [
            {
                name: "Sample Donor",
                bloodGroup: "O+",
                city: "Thane",
                contact: "9876543210"
            },
            {
                name: "Demo Donor",
                bloodGroup: "A+",
                city: "Mumbai",
                contact: "9876501234"
            }
        ];

        const searchInput = document.getElementById("searchInput");
        const bloodFilter = document.getElementById("bloodFilter");
        const donorTableBody = document.getElementById("donorTableBody");
        const emptyMessage = document.getElementById("emptyMessage");

        function renderDonors() {
            const searchText = searchInput.value.trim().toLowerCase();
            const selectedGroup = bloodFilter.value;

            const filteredDonors = donors.filter(function(donor) {
                const matchesSearch =
                    donor.name.toLowerCase().includes(searchText) ||
                    donor.bloodGroup.toLowerCase().includes(searchText) ||
                    donor.city.toLowerCase().includes(searchText);

                const matchesGroup =
                    selectedGroup === "" ||
                    donor.bloodGroup === selectedGroup;

                return matchesSearch && matchesGroup;
            });

            donorTableBody.replaceChildren();

            filteredDonors.forEach(function(donor) {
                const row = document.createElement("tr");

                [
                    donor.name,
                    donor.bloodGroup,
                    donor.city,
                    donor.contact
                ].forEach(function(value) {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.appendChild(cell);
                });

                const actionCell = document.createElement("td");
                const viewButton = document.createElement("button");

                viewButton.type = "button";
                viewButton.className = "view-btn";
                viewButton.textContent = "View Details";

                viewButton.addEventListener("click", function() {
                    alert(
                        "Donor Details\n\n" +
                        "Name: " + donor.name + "\n" +
                        "Blood Group: " + donor.bloodGroup + "\n" +
                        "City: " + donor.city + "\n" +
                        "Contact: " + donor.contact
                    );
                });

                actionCell.appendChild(viewButton);
                row.appendChild(actionCell);
                donorTableBody.appendChild(row);
            });

            emptyMessage.textContent = filteredDonors.length === 0
                ? "No matching donors found."
                : "";

            emptyMessage.style.display =
                filteredDonors.length === 0 ? "block" : "none";
        }

        searchInput.addEventListener("input", renderDonors);
        bloodFilter.addEventListener("change", renderDonors);

        renderDonors();
    </script>

</body>
</html>
